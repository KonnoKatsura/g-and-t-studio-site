let previous=performance.now();renderer.setAnimationLoop(now=>{let dt=Math.min((now-previous)/1000,.1);previous=now;if(document.hidden||window.roomUI.flat||window.roomUI.paused)return;if(transition){camera.position.lerp(transition.p,1-Math.exp(-dt*5));controls.target.lerp(transition.t,1-Math.exp(-dt*5));if(camera.position.distanceTo(transition.p)<.015)transition=null}animateLatte(now);controls.update(dt);renderer.render(scene,camera);window.roomStats={calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,geometries:renderer.info.memory.geometries,textures:renderer.info.memory.textures}});status.textContent='';window.roomReady=true;
